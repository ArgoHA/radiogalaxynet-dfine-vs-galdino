[project]
name = "radiogalaxynet-dfine-vs-galdino"
version = "0.1.0"
description = "Reproduce the D-FINE-seg vs Gal-DINO comparison on RadioGalaxyNET"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dfine-seg[export,trt]==0.7.0",
    "pycocotools>=2.0.8",
    # pinned to the environment that produced the reported numbers (newer torch shifts AP ~0.3)
    "torch==2.13.0",
    "torchvision==0.28.0",
    "numpy==2.1.1",
    "opencv-python-headless==4.10.0.84",
    "onnx==1.22.0",
    "onnxruntime==1.21.1",
    "albumentations==2.0.8",
]

[tool.uv]
package = false
